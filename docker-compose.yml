version: "3"
services:
  db:
    # 既存データ(./postgres_dev)がPostgreSQL 16のため16系に固定（18はデータ配置が非互換）
    image: "postgres:16@sha256:63e83b5a3dc36a917dccb76fe1bd2ac51f1ec9c1deb47ff20d4f04233bf6eae9"
    container_name: koremina_dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - ./postgres_dev:/var/lib/postgresql/data
