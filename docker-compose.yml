version: "3"
services:
  db:
    # 既存データ(./postgres_dev)がPostgreSQL 16のため16系に固定（18はデータ配置が非互換）
    image: "postgres:18@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636"
    container_name: koremina_dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - ./postgres_dev:/var/lib/postgresql/data
